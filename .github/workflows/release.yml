name: Release

on:
  push:
    tags:
      - 'v*'

# Cancel ALL in-progress release workflows when a new one is triggered
# (regardless of which tag triggered it)
concurrency:
  group: release
  cancel-in-progress: true

env:
  ENV: production

permissions:
  actions: write
  contents: write

jobs:
  build:
    name: Build (aarch64)
    runs-on: macos-latest

    steps:
      # ============================================
      # 0. Cancel any older queued/in-progress release runs
      # ============================================
      - name: Cancel older release runs
        uses: actions/github-script@v7
        with:
          script: |
            const currentRunId = context.runId;
            async function cancelRun(run) {
              if (run.id === currentRunId) return;
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                console.log(`Cancelled run #${run.run_number} (${run.id})`);
              } catch (e) {
                if (e.status === 409) {
                  console.log(`Run #${run.run_number} already cancelled or completed`);
                } else {
                  console.log(`Skipping run #${run.run_number}: ${e.message}`);
                }
              }
            }
            // Cancel queued runs
            const { data: queued } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              status: 'queued',
              per_page: 100,
            });
            for (const run of queued.workflow_runs) {
              await cancelRun(run);
            }
            // Cancel in-progress runs
            const { data: inProgress } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              status: 'in_progress',
              per_page: 100,
            });
            for (const run of inProgress.workflow_runs) {
              await cancelRun(run);
            }

      # ============================================
      # 1. Checkout source code
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # 2. Install Node.js 20 (with npm cache)
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ============================================
      # 3. Install Rust with target + cache
      # ============================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin
          workspaces: desktop/src-tauri

      # ============================================
      # 4. Install Python 3.11
      # ============================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============================================
      # 5. Install uv (with cache)
      # ============================================
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml', 'backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ============================================
      # 6. Build frontend
      # ============================================
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # ============================================
      # 7. Build backend with PyInstaller
      # ============================================
      - name: Build backend
        run: |
          cd backend
          uv sync
          uv pip install pyinstaller
          export PYTHONPATH=.
          # Don't use --clean so PyInstaller can reuse its cache between runs
          .venv/bin/python -m PyInstaller agent-factory.spec --noconfirm

      # ============================================
      # 8. Copy binaries to Tauri
      # ============================================
      - name: Prepare Tauri binaries
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp backend/dist/agent-factory-backend desktop/src-tauri/binaries/agent-factory-backend
          chmod +x desktop/src-tauri/binaries/agent-factory-backend
          # Tauri externalBin requires architecture-specific filenames
          cp backend/dist/agent-factory-backend "desktop/src-tauri/binaries/agent-factory-backend-aarch64-apple-darwin"
          chmod +x "desktop/src-tauri/binaries/agent-factory-backend-aarch64-apple-darwin"
          brew install --quiet redis
          cp "$(brew --prefix redis)/bin/redis-server" desktop/src-tauri/binaries/redis-server
          chmod +x desktop/src-tauri/binaries/redis-server
          cp "$(brew --prefix redis)/bin/redis-server" "desktop/src-tauri/binaries/redis-server-aarch64-apple-darwin"
          chmod +x "desktop/src-tauri/binaries/redis-server-aarch64-apple-darwin"

      # ============================================
      # 9. Build Tauri desktop app
      # ============================================
      - name: Install cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install tauri-cli
        run: |
          # Try cargo-binstall first, fall back to cargo install on failure
          cargo binstall cargo-tauri --locked --no-confirm || cargo install tauri-cli --locked

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          cd desktop/src-tauri
          cargo tauri build --target aarch64-apple-darwin

      # ============================================
      # 10. Rename and collect artifacts
      # ============================================
      - name: Prepare artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="aarch64-apple-darwin"

          DMG_SRC=$(find "desktop/src-tauri/target/${TARGET}/release/bundle/dmg" -name '*.dmg' | head -n 1)
          APP_TAR_SRC=$(find "desktop/src-tauri/target/${TARGET}/release/bundle/macos" -name '*.app.tar.gz' | head -n 1)

          mkdir -p artifacts

          if [ -z "$DMG_SRC" ] || [ ! -f "$DMG_SRC" ]; then
            echo "ERROR: .dmg not found in desktop/src-tauri/target/${TARGET}/release/bundle/dmg/"
            find "desktop/src-tauri/target/${TARGET}/release/bundle/" -type f
            exit 1
          fi
          cp "$DMG_SRC" "artifacts/Agent-Factory_${VERSION}_aarch64.dmg"

          if [ -n "$APP_TAR_SRC" ] && [ -f "$APP_TAR_SRC" ]; then
            cp "$APP_TAR_SRC" "artifacts/Agent-Factory_${VERSION}_aarch64.app.tar.gz"
            if [ -f "${APP_TAR_SRC}.sig" ]; then
              cp "${APP_TAR_SRC}.sig" "artifacts/Agent-Factory_${VERSION}_aarch64.app.tar.gz.sig"
            fi
          else
            echo "WARNING: .app.tar.gz not found — updater artifacts will not be available"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-aarch64
          path: artifacts/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download aarch64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-aarch64
          path: artifacts/aarch64

      - name: Generate latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          SIG=""
          SIG_FILE="artifacts/aarch64/Agent-Factory_${VERSION}_aarch64.app.tar.gz.sig"
          if [ -f "$SIG_FILE" ]; then
            SIG=$(cat "$SIG_FILE")
          fi

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="${{ github.repository }}"

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Release ${GITHUB_REF_NAME}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIG}",
                "url": "https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/Agent-Factory_${VERSION}_aarch64.app.tar.gz"
              }
            }
          }
          EOF

      # ============================================
      # 4. Create draft release and upload all assets
      # ============================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/aarch64/*
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
