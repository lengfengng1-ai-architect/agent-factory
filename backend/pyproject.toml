[project]
name = "agent-factory"
version = "0.1.0"
description = "Full-stack LLM Agent management console"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn>=0.45.0",
    "python-multipart>=0.0.26",
    "sqlalchemy>=2.0.49",
    "pydantic>=2.13.3",
    "langchain>=1.2.15",
    "langchain-core>=1.3.0",
    "langchain-openai>=1.1.16",
    "duckduckgo-search>=6.0.0",
    "ddgs>=9.0",
    "redis>=5.2.0",
    "pypdf>=4.0",
    "lark-oapi>=1.4.0",
    "langchain-deepseek>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false
